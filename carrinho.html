<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrinho</title>

<style>

body{
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.8)),
url("imagens/logo fundo.png");
background-size:cover;
background-position:center;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#000000;
padding:40px;
border-radius:10px;
width:400px;
border:1px solid #222;
position:relative;
z-index:5;
}

/* TITULO CARRINHO */

.titulo-carrinho{
color:white;
margin-bottom:20px;
letter-spacing:2px;
position:relative;
z-index:10;
text-align:center;
}

.info{
margin-bottom:15px;
color:#ffffff;
font-size:16px;
}

.preco{
color:#ffffff;
font-size:20px;
margin-bottom:25px;
}

.botao{
background:#474747;
border:none;
padding:12px;
width:100%;
color:white;
font-size:16px;
cursor:pointer;
border-radius:5px;
transition:0.3s;
}

.botao:hover{
background:#302e2e;
}

</style>
</head>

<body>

<div class="container">

<h1 class="titulo-carrinho">CARRINHO</h1>

<p class="info">Produto: <span id="produto"></span></p>
<p class="info">Tamanho: <span id="tamanho"></span></p>

<p class="preco">Preço: R$ <span id="preco"></span></p>

<button class="botao" onclick="irCheckout()">Finalizar Compra</button>


</div>

<script>

const params = new URLSearchParams(window.location.search);

document.getElementById("produto").innerText = params.get("produto");
document.getElementById("tamanho").innerText = params.get("tamanho");
document.getElementById("preco").innerText = params.get("preco");

function irCheckout(){

const produto = params.get("produto")
const tamanho = params.get("tamanho")
const preco = params.get("preco")

window.location.href =
`checkout.html?produto=${produto}&tamanho=${tamanho}&preco=${preco}`

}

</script>

</body>
</html>
