<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escolher Tamanho</title>

<style>

body{
background:#0a0a0a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#111;
padding:40px;
border-radius:10px;
width:350px;
text-align:center;
border:1px solid #222;
}

h1{
margin-bottom:20px;
letter-spacing:2px;
}

.tamanhos{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:25px;
}

.tamanho{
padding:10px;
border:1px solid #444;
cursor:pointer;
transition:0.2s;
}

.tamanho:hover{
background:#302e2e;
border-color:#ffffff;
}

.selecionado{
background:#000000;
}

.botao{
background:#000000;
border:none;
padding:12px 20px;
color:white;
cursor:pointer;
border-radius:5px;
width:100%;
font-size:16px;
}

.botao:hover{
background:#302e2e;
}

</style>
</head>

<body>

<div class="container">

<h1>TAMANHO</h1>

<div class="tamanhos">

<div class="tamanho">P</div>
<div class="tamanho">M</div>
<div class="tamanho">G</div>
<div class="tamanho">GG</div>

</div>

<button class="botao" onclick="confirmar()">Adicionar ao Carrinho</button>

</div>

<script>

let tamanhoSelecionado = "";

document.querySelectorAll(".tamanho").forEach(t => {

t.addEventListener("click", () => {

document.querySelectorAll(".tamanho").forEach(el => el.classList.remove("selecionado"));

t.classList.add("selecionado");

tamanhoSelecionado = t.innerText;

});

});

function confirmar(){

if(tamanhoSelecionado == ""){
alert("Escolha um tamanho");
return;
}

const params = new URLSearchParams(window.location.search);

const produto = params.get("produto");
const preco = params.get("preco");

window.location.href = `carrinho.html?produto=${produto}&preco=${preco}&tamanho=${tamanhoSelecionado}`;

}

</script>

</body>
</html>
