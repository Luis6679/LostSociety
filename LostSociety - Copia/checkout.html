<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<style>

body{
background:#0a0a0a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{
background:#111;
padding:40px;
border-radius:12px;
width:450px;
border:1px solid #222;
box-shadow:0 0 20px #000;
}

h1{
margin-bottom:25px;
letter-spacing:2px;
text-align:center;
}

input, select{
width:100%;
padding:10px;
margin-bottom:15px;
background:#000;
border:1px solid #333;
color:white;
border-radius:5px;
}

.botao{
background:#000000;
border:none;
padding:12px;
width:100%;
color:white;
font-size:16px;
cursor:pointer;
border-radius:5px;
transition:0.3s;
}

.botao:hover{
background:#302e2e;
}

.total{
margin-top:10px;
margin-bottom:20px;
font-size:18px;
text-align:center;
}

.agradecimento{
display:none;
text-align:center;
}

.agradecimento h2{
color:#ffffff;
}

</style>

</head>

<body>

<div class="container" id="checkout">

<h1>ENDEREÇO</h1>

<input id="nome" placeholder="Nome completo">
<input id="rua" placeholder="Rua">
<input id="numero" placeholder="Número">
<input id="bairro" placeholder="Bairro">
<input id="cep" placeholder="CEP">
<input id="cidade" placeholder="Cidade">
<input id="estado" placeholder="Estado">

<h1>PAGAMENTO</h1>

<select id="pagamento">
<option value="PIX">PIX</option>
<option value="Cartão">Cartão de Crédito</option>
<option value="Boleto">Boleto</option>
</select>

<button class="botao" onclick="calcularFrete()">Calcular Frete</button>

<p id="frete"></p>

<div class="total" id="total"></div>

<button class="botao" onclick="enviarPedido()">Finalizar Pedido</button>

</div>

<div class="container agradecimento" id="agradecimento">

<h2>🔥 Pedido realizado!</h2>

<p>Obrigado pela sua compra.</p>

<p>Seu pedido foi enviado e será processado em breve.</p>

<p>Em breve você receberá mais informações.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("saRUeAJlZxkikJa9r")

const params = new URLSearchParams(window.location.search)

const produto = params.get("produto")
const tamanho = params.get("tamanho")
const preco = Number(params.get("preco"))

let valorFrete = 0

async function calcularFrete(){

const cep = document.getElementById("cep").value

const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`)
const dados = await resposta.json()

if(dados.erro){
document.getElementById("frete").innerText = "CEP inválido"
return
}

valorFrete = 20

document.getElementById("frete").innerText =
"Frete estimado: R$ " + valorFrete

const total = preco + valorFrete

document.getElementById("total").innerText =
"Total: R$ " + total

}

function enviarPedido(){

const pagamento = document.getElementById("pagamento").value

emailjs.send("service_35nb8vs","template_eiusq3a",{

produto: produto,
tamanho: tamanho,
preco: preco,

nome: document.getElementById("nome").value,
rua: document.getElementById("rua").value,
numero: document.getElementById("numero").value,
bairro: document.getElementById("bairro").value,
cep: document.getElementById("cep").value,
cidade: document.getElementById("cidade").value,
estado: document.getElementById("estado").value,

frete: valorFrete,
pagamento: pagamento

})

.then(function(){

document.getElementById("checkout").style.display="none"
document.getElementById("agradecimento").style.display="block"

})

}

</script>

</body>
</html>
